# Smart Traffic — local Windows + Docker Desktop, CPU-only, no AWS.
#
# Host processes (producers, Spark, Streamlit) talk to Kafka on localhost:9092.
# Containerised workers reach Kafka on the internal listener kafka:29092 and
# reach MinIO at http://minio:9000. See README "Host vs Docker matrix".
#
# Resource limits are intentionally tight so a runaway service fails fast
# instead of swap-thrashing a 16 GB laptop. For very lean dev iteration,
# override with docker-compose.minimal.yml.

services:

  # ==========================================================================
  # Message bus
  # ==========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    mem_limit: 1500m
    cpus: 1.5

  # One-shot: declare topics with explicit partition count + retention so the
  # broker does NOT auto-create them with 1 partition the first time a
  # producer publishes.
  kafka-init:
    image: python:3.10-slim
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_REPLICATION_FACTOR: 1
      KAFKA_RETENTION_MS: 86400000
      TOPIC_SENSORS: topic_sensors
      TOPIC_GPS: topic_gps
      TOPIC_CCTV: topic_cctv
      TOPIC_CCTV_INFERRED: topic_cctv_inferred
      TOPIC_WEATHER: topic_weather
      TOPIC_SPEED_PREDICTIONS: topic_speed_predictions
    volumes:
      - ./infra:/infra:ro
    command: ["sh", "-c", "pip install --quiet confluent-kafka>=2.4.0 && python /infra/init_topics.py"]
    restart: "no"

  kafka-ui:
    image: redpandadata/console:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/admin/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 256m
    cpus: 0.25

  # ==========================================================================
  # Object storage (annotated CCTV JPEGs)
  # ==========================================================================

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  # One-shot: create the cctv-frames bucket and make it publicly readable so
  # Streamlit (running on the host) can `st.image(frame_url)` without auth.
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cctv-frames}
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} >/dev/null 2>&1; do
        echo 'Waiting for MinIO…'; sleep 2;
      done &&
      mc mb --ignore-existing local/$${MINIO_BUCKET} &&
      mc anonymous set download local/$${MINIO_BUCKET} &&
      echo 'MinIO bucket $${MINIO_BUCKET} ready.'
      "
    restart: "no"

  # ==========================================================================
  # YOLO Kafka workers (Phase 1, the centrepiece)
  # ==========================================================================

  yolo-worker:
    build:
      context: ./yolo_worker
      dockerfile: Dockerfile
    image: smart-traffic/yolo-worker:phase1
    pull_policy: build
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      INPUT_TOPIC: ${TOPIC_CCTV:-topic_cctv}
      OUTPUT_TOPIC: ${TOPIC_CCTV_INFERRED:-topic_cctv_inferred}
      CONSUMER_GROUP: yolo-workers
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-cctv-frames}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000/cctv-frames}
      YOLO_MODEL_PATH: /app/weights/best.pt
      YOLO_IMGSZ: ${YOLO_IMGSZ:-480}
      YOLO_CONF: ${YOLO_CONF:-0.3}
      YOLO_FRAME_MAX_AGE_SEC: ${YOLO_FRAME_MAX_AGE_SEC:-10}
      YOLO_WORKER_METRICS_PORT: 9100
      YOLO_MODEL_VERSION: ${YOLO_MODEL_VERSION:-yolo_traffic_model_v1}
      SCHEMA_DIR: /app/schemas
    volumes:
      - ./schemas:/app/schemas:ro
      # Mount the fine-tuned YOLO weights folder read-only.
      - ./models/yolo_traffic_model/weights:/app/weights:ro
    deploy:
      replicas: 2
    mem_limit: 1500m
    cpus: 1.0
    restart: unless-stopped

  # ==========================================================================
  # Phase 2 — ML predictor (LightGBM exported to ONNX, ran by onnxruntime)
  # ==========================================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.5

  ml-predictor-worker:
    build:
      context: ./ml_predictor_worker
      dockerfile: Dockerfile
    image: smart-traffic/ml-predictor-worker:phase2
    pull_policy: build
    container_name: ml-predictor-worker
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      INPUT_TOPIC: ${TOPIC_SENSORS:-topic_sensors}
      OUTPUT_TOPIC: ${TOPIC_SPEED_PREDICTIONS:-topic_speed_predictions}
      CONSUMER_GROUP: ml-predictor-workers
      ML_MODEL_PATH: /app/models/speed_predictor/speed_predictor.onnx
      ML_MODEL_META_PATH: /app/models/speed_predictor/speed_predictor_meta.json
      ML_MODEL_VERSION: ${ML_MODEL_VERSION:-lgbm_speed_v1}
      ML_WORKER_METRICS_PORT: 9101
      SCHEMA_DIR: /app/schemas
      DELTA_SENSOR_PATH: /opt/delta_tables/sensor_speeds
      ML_WARM_START_MINUTES: ${ML_WARM_START_MINUTES:-30}
    volumes:
      - ./schemas:/app/schemas:ro
      # Mount only the speed-predictor folder, not all of models/, to avoid
      # exposing the fine-tuned YOLO weights to this worker.
      - ./models/speed_predictor:/app/models/speed_predictor:ro
      - ./delta_tables:/opt/delta_tables:ro
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  # ==========================================================================
  # Observability (basic — full Grafana dashboards land in Phase 4)
  # ==========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=3d"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.25

  kafka-lag-monitor:
    build:
      context: ./monitoring/lag_monitor
      dockerfile: Dockerfile
    image: smart-traffic/kafka-lag-monitor:phase4
    pull_policy: build
    container_name: kafka-lag-monitor
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LAG_MONITOR_GROUPS: yolo-workers,ml-predictor-workers
      LAG_MONITOR_TOPICS: topic_cctv,topic_sensors,topic_cctv_inferred,topic_speed_predictions,topic_gps,topic_weather
      LAG_MONITOR_POLL_SECONDS: 15
      LAG_MONITOR_METRICS_PORT: 9102
    mem_limit: 128m
    cpus: 0.25
    restart: unless-stopped

volumes:
  minio-data:
  prometheus-data:
  grafana-data:
  mlflow-data:
