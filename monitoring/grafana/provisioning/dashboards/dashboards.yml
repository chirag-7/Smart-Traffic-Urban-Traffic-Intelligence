apiVersion: 1

# Tell Grafana where to find dashboard JSON files. Smart-traffic ships one
# pre-built dashboard at /var/lib/grafana/dashboards/smart-traffic.json
# (mounted from monitoring/grafana/dashboards/).

providers:
  - name: smart-traffic
    orgId: 1
    folder: Smart Traffic
    type: file
    disableDeletion: false
    editable: true
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
